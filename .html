<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ดี๊กันนะเบบี๋ 💙</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    overflow: hidden;
    font-family: Arial, Tahoma, sans-serif;

    background:
        radial-gradient(circle at 20% 20%, #ffffff80 0 8%, transparent 9%),
        radial-gradient(circle at 80% 80%, #ffffff60 0 6%, transparent 7%),
        linear-gradient(135deg, #75d5ff, #5fc4f0, #b8edff);

    display: flex;
    justify-content: center;
    align-items: center;
}

/* =========================
   รูปตกแต่ง
========================= */

.decor {
    position: fixed;
    object-fit: cover;

    border: 5px solid white;
    border-radius: 30px;

    box-shadow:
        0 10px 25px rgba(0,0,0,0.20);

    z-index: 1;

    transition: 0.3s;
}

.decor:hover {
    transform: scale(1.08) rotate(0deg);
}

/* รูปซ้ายบน */
.decor-left {
    width: 180px;
    height: 180px;

    left: 4%;
    top: 6%;

    transform: rotate(-8deg);
}

/* รูปขวาล่าง */
.decor-right {
    width: 180px;
    height: 180px;

    right: 4%;
    bottom: 6%;

    transform: rotate(8deg);
}

/* =========================
   กล่องหลัก
========================= */

.container {
    position: relative;
    z-index: 3;

    width: min(90%, 600px);

    text-align: center;

    padding: 30px;

    background: rgba(255,255,255,0.25);

    border: 2px solid rgba(255,255,255,0.6);

    border-radius: 40px;

    backdrop-filter: blur(8px);

    box-shadow:
        0 15px 40px rgba(0,0,0,0.15);
}

/* =========================
   รูปหลัก
========================= */

.main-img {
    width: 250px;
    height: 250px;

    object-fit: cover;

    border-radius: 35px;

    border: 6px solid white;

    box-shadow:
        0 12px 30px rgba(0,0,0,0.22);

    animation: floating 3s ease-in-out infinite;
}

/* รูปลอยขึ้นลง */
@keyframes floating {

    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-12px);
    }
}

/* =========================
   หัวข้อ
========================= */

h1 {
    margin: 18px 0;

    color: #173247;

    font-size: 38px;

    font-weight: 800;

    text-shadow:
        0 3px 8px rgba(255,255,255,0.8);
}

/* =========================
   ปุ่ม
========================= */

.love-button {

    display: block;

    margin: 0 auto 14px;

    padding: 12px 28px;

    min-width: 260px;

    border: 2px solid #222;

    border-radius: 50px;

    background: white;

    color: #238fc1;

    font-size: 17px;

    font-weight: bold;

    cursor: pointer;

    box-shadow:
        0 6px 15px rgba(0,0,0,0.18);

    transition: 0.2s;
}

.love-button:hover {

    transform: scale(1.06);

    box-shadow:
        0 8px 20px rgba(0,0,0,0.22);
}

.love-button:active {

    transform: scale(0.92);
}

/* ปุ่มหาย */
.hide-button {

    opacity: 0;

    transform: scale(0.5);
}

/* =========================
   ข้อความลอย
========================= */

.bubble {

    position: fixed;

    background: white;

    color: #238fc1;

    padding: 10px 20px;

    border-radius: 50px;

    font-size: 16px;

    font-weight: bold;

    box-shadow:
        0 6px 15px rgba(0,0,0,0.18);

    z-index: 10;

    white-space: nowrap;

    animation:
        bubbleAnimation 3s ease-out forwards;
}

@keyframes bubbleAnimation {

    0% {
        opacity: 0;

        transform:
            translateY(20px)
            scale(0.7);
    }

    15% {
        opacity: 1;
    }

    100% {

        opacity: 0;

        transform:
            translateY(-180px)
            scale(1);
    }
}

/* =========================
   หัวใจลอย
========================= */

.heart {

    position: fixed;

    font-size: 28px;

    z-index: 5;

    pointer-events: none;

    animation:
        heartAnimation 2.5s ease-out forwards;
}

@keyframes heartAnimation {

    0% {

        opacity: 0;

        transform:
            translateY(20px)
            scale(0.5);
    }

    20% {

        opacity: 1;
    }

    100% {

        opacity: 0;

        transform:
            translateY(-220px)
            translateX(var(--move))
            scale(1.2);
    }
}

/* =========================
   มือถือ
========================= */

@media (max-width: 700px) {

    .decor-left,
    .decor-right {

        width: 90px;
        height: 90px;
    }

    .main-img {

        width: 190px;
        height: 190px;
    }

    h1 {

        font-size: 29px;
    }

    .love-button {

        min-width: 220px;

        font-size: 16px;
    }
}
</style>

</head>

<body>

<!-- รูปตกแต่งซ้ายบน -->
<img
    src="c:\Users\chana\Downloads\S__52985867.jpg"
    class="decor decor-left"
    alt="Hangyodon"
>

<!-- รูปตกแต่งขวาล่าง -->
<img
    src="c:\Users\chana\Downloads\S__52985866.jpg"
    class="decor decor-right"
    alt="Hangyodon"
>


<!-- กล่องหลัก -->

<div class="container">

    <!-- รูปหลัก -->
    <img
        src="c:\Users\chana\Downloads\S__52985865.jpg"
        class="main-img"
        alt="Hangyodon"
    >

    <h1>
        ดี๊กันนะเบบี๋ 🥺💙
    </h1>


    <!-- ปุ่มง้อ -->

    <button
        class="love-button"
        id="sorryButton"
        onclick="changeSorry()"
    >
        ไม่ทำงอนแล้วนะค้าบบ 🥺
    </button>


    <!-- ปุ่มดี๊กัน -->

    <button
        class="love-button"
        onclick="sayLove()"
    >
        ดี๊กัน 💙
    </button>

</div>


<script>

/* =========================
   ปุ่มง้อ
========================= */

let sorryClick = 0;

function changeSorry() {

    const button =
        document.getElementById("sorryButton");

    sorryClick++;


    /* กดครั้งแรก */

    if (sorryClick === 1) {

        button.innerText =
            "ไม่หายงอนหรอก 😤";

        button.style.transform =
            "scale(1.08)";


        setTimeout(() => {

            button.style.transform =
                "scale(1)";

        }, 200);
    }


    /* กดครั้งที่สอง */

    else if (sorryClick === 2) {

        button.classList.add(
            "hide-button"
        );


        setTimeout(() => {

            button.remove();

        }, 300);
    }
}


/* =========================
   ปุ่มดี๊กัน
========================= */

function sayLove() {

    const messages = [

        "ดี๊กันนน 💙",
        "รักนะเบบี๋ 💙",
        "คนเก่งของเค้า 🥰",
        "หายงอนแล้วนะ 💕",
        "ดีกันแล้วน้าา 😚",
        "โอ๋ ๆ นะ 🫶",
        "รักที่สุดเลย 💙",
        "Hangyodon มาช่วยง้อแล้ว 🐟"

    ];


    /* สร้างข้อความ */

    for (let i = 0; i < 12; i++) {

        setTimeout(() => {

            const bubble =
                document.createElement("div");

            bubble.className =
                "bubble";

            bubble.innerText =
                messages[
                    Math.floor(
                        Math.random()
                        * messages.length
                    )
                ];


            bubble.style.left =
                Math.max(
                    10,
                    Math.random()
                    * (window.innerWidth - 200)
                ) + "px";


            bubble.style.top =
                Math.max(
                    30,
                    Math.random()
                    * window.innerHeight * 0.75
                ) + "px";


            document.body.appendChild(
                bubble
            );


            setTimeout(() => {

                bubble.remove();

            }, 3000);

        }, i * 100);
    }


    /* =========================
       สร้างหัวใจ
    ========================= */

    const hearts = [
        "💙",
        "🩵",
        "💙",
        "💗",
        "🫧",
        "🐟"
    ];


    for (let i = 0; i < 18; i++) {

        setTimeout(() => {

            const heart =
                document.createElement("div");

            heart.className =
                "heart";

            heart.innerText =
                hearts[
                    Math.floor(
                        Math.random()
                        * hearts.length
                    )
                ];


            heart.style.left =
                Math.random() * 100 + "vw";


            heart.style.top =
                65 +
                Math.random() * 25 +
                "vh";


            heart.style.setProperty(
                "--move",
                (Math.random() * 180 - 90)
                + "px"
            );


            document.body.appendChild(
                heart
            );


            setTimeout(() => {

                heart.remove();

            }, 2600);

        }, i * 80);
    }

}

</script>

</body>
</html>
